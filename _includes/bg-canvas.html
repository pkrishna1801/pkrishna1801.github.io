<!-- Shared floating wireframe background, included site-wide from _layouts/default.html -->
<style>
  /* FIX 1: z-index: -1 keeps canvas behind ALL content (was 0, caused blue wash) */
  #bg-canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: -1;
    pointer-events: none;
  }

  /* FIX 2: Ensure all content layers sit above the canvas */
  main, .wrapper, .page-content, nav, .navbar, footer {
    position: relative;
    z-index: 1;
  }
</style>

<canvas id="bg-canvas"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ═══════════════════════════════════════
   THREE.JS — Floating Wireframe Background
   ═══════════════════════════════════════ */
(function () {
  const canvas = document.getElementById('bg-canvas');
  if (!canvas || canvas.__bgInit) return;
  canvas.__bgInit = true;

  const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.z = 30;

  const group = new THREE.Group();
  scene.add(group);

  /* FIX 5: Reduced opacity so shapes don't create a blue wash over content */
  /* FIX 6: light-mode opacities are near-invisible against a near-black dark-mode
     background, so scale them up when data-theme="dark" is active */
  function isDarkTheme() {
    return document.documentElement.getAttribute('data-theme') === 'dark';
  }

  const baseOpacities = [0.10, 0.08, 0.07];
  const darkOpacities  = [0.45, 0.36, 0.30];
  const pointsOpacity  = { light: 0.35, dark: 0.55 };

  function currentOpacities() {
    return isDarkTheme() ? darkOpacities : baseOpacities;
  }

  const materials = [
    new THREE.MeshStandardMaterial({ color: 0x3b82f6, wireframe: true, transparent: true, opacity: currentOpacities()[0] }),
    new THREE.MeshStandardMaterial({ color: 0x6366f1, wireframe: true, transparent: true, opacity: currentOpacities()[1] }),
    new THREE.MeshStandardMaterial({ color: 0x60a5fa, wireframe: true, transparent: true, opacity: currentOpacities()[2] }),
  ];
  const geometries = [
    new THREE.IcosahedronGeometry(3, 1),
    new THREE.OctahedronGeometry(2.5, 0),
    new THREE.TorusGeometry(2, 0.6, 8, 20),
    new THREE.TetrahedronGeometry(2, 0),
    new THREE.DodecahedronGeometry(2, 0),
    new THREE.TorusKnotGeometry(1.5, 0.5, 50, 8),
  ];

  const shapes = [];
  for (let i = 0; i < 14; i++) {
    const mesh = new THREE.Mesh(geometries[i % geometries.length], materials[i % materials.length]);
    mesh.position.set((Math.random() - 0.5) * 44, (Math.random() - 0.5) * 32, (Math.random() - 0.5) * 20);
    mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
    mesh.userData = {
      rx: (Math.random() - 0.5) * 0.007,
      ry: (Math.random() - 0.5) * 0.005,
      phase: Math.random() * Math.PI * 2,
      speed: 0.3 + Math.random() * 0.5,
      amp: 0.4 + Math.random() * 1.2,
    };
    group.add(mesh);
    shapes.push(mesh);
  }

  const pGeo = new THREE.BufferGeometry();
  const positions = new Float32Array(250 * 3);
  for (let i = 0; i < positions.length; i++) positions[i] = (Math.random() - 0.5) * 60;
  pGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const pointsMaterial = new THREE.PointsMaterial({ color: 0x3b82f6, size: 0.07, transparent: true, opacity: isDarkTheme() ? pointsOpacity.dark : pointsOpacity.light });
  scene.add(new THREE.Points(pGeo, pointsMaterial));

  scene.add(new THREE.AmbientLight(0x3b82f6, 0.3));
  const dir = new THREE.DirectionalLight(0xffffff, 0.2);
  dir.position.set(5, 5, 5);
  scene.add(dir);

  /* Keep opacities in sync if the user toggles light/dark mode after load */
  new MutationObserver(() => {
    const dark = isDarkTheme();
    const op = dark ? darkOpacities : baseOpacities;
    materials.forEach((m, i) => { m.opacity = op[i]; });
    pointsMaterial.opacity = dark ? pointsOpacity.dark : pointsOpacity.light;
  }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  let mx = 0, my = 0;
  document.addEventListener('mousemove', e => {
    mx = (e.clientX / window.innerWidth - 0.5) * 2;
    my = (e.clientY / window.innerHeight - 0.5) * 2;
  });

  (function animate(t) {
    requestAnimationFrame(animate);
    const time = t * 0.001;
    group.rotation.y += (mx * 0.04 - group.rotation.y) * 0.018;
    group.rotation.x += (-my * 0.025 - group.rotation.x) * 0.018;
    shapes.forEach(m => {
      m.rotation.x += m.userData.rx;
      m.rotation.y += m.userData.ry;
      m.position.y += Math.sin(time * m.userData.speed + m.userData.phase) * 0.008 * m.userData.amp;
    });
    renderer.render(scene, camera);
  })(0);

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
})();
</script>
