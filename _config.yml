### Site Settings ###
title               : Prarthana Krishnamurthy
description         : >-
                      ML Engineer and AI Researcher focused on medical imaging,
                      molecular modeling, and retrieval-augmented generation.
                      I turn complex research into scalable, production-ready AI.
image               : /assets/og-image.png    # Link preview image (LinkedIn, Twitter, Slack, etc.)
baseurl             : ""            # Change to empty quotes if you are hosting your site at <your-username>.github.io directly
repository          : pkrishna1801/pkrishna1801.github.io  # Change to <your-username>/<your-username>.github.io (or remove it if you don't need remote projects)
remote_theme        : yousinix/portfolYOU
open_new_tab        : false                    # Opens external URLs in new tab (works for posts, projects and navbar only)


### Plugins ###
plugins:
  - jemoji
  - jekyll-seo-tag
  - jekyll-sitemap


### Navbar Settings ###
nav_exclude:                                            # The following paths are excluded from navbar
  - pages/tags.html
  - pages/404.html
  - pages/index.md



